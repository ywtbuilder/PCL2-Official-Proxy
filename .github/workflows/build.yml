name: Build PCL Official Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Release
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.14,18.0)'
          msbuild-architecture: x64

      - name: Record source revision
        shell: pwsh
        run: |
          $path = 'Plain Craft Launcher 2/Modules/Base/ModBase.vb'
          $source = [IO.File]::ReadAllText($path)
          $source = $source.Replace('Public Const CommitHash As String = ""', ('Public Const CommitHash As String = "' + $env:GITHUB_SHA + '"'))
          [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))

      - name: Restore dependencies
        run: dotnet restore PCLCS/PCLCS.csproj --verbosity minimal

      - name: Build Release
        run: msbuild "Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj" /m /p:Configuration=Release /verbosity:minimal

      - name: Package application and proxy configuration
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'Plain Craft Launcher 2/bin'
          $package = Join-Path $env:GITHUB_WORKSPACE 'artifacts/PCL2-Official-Proxy'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $output 'Plain Craft Launcher 2.exe'), (Join-Path $output 'Plain Craft Launcher 2.exe.config') -Destination $package
          Get-ChildItem -LiteralPath $output -Filter '*.dll' -File | Copy-Item -Destination $package
          Copy-Item -LiteralPath 'LICENCE', '本地官方源说明.txt', '微软登录接入说明.txt' -Destination $package
          $config = [xml](Get-Content -LiteralPath (Join-Path $package 'Plain Craft Launcher 2.exe.config') -Raw)
          if ($config.configuration.'system.net'.defaultProxy.proxy.proxyaddress -ne 'http://127.0.0.1:7897') {
            throw 'The application proxy configuration was not included in the build output.'
          }
          Get-ChildItem -LiteralPath $package -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), [IO.Path]::GetFileName($_.Path) } |
            Set-Content -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PCL2-Official-Proxy
          path: artifacts/PCL2-Official-Proxy/
          if-no-files-found: error
          retention-days: 7
